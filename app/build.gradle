plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nlhearim.sangdam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nlhearim.sangdam'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // 고정 키로 서명해야 새 버전 APK를 기존 앱 위에 덮어 설치할 수 있습니다.
        fixed {
            storeFile file('app.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
